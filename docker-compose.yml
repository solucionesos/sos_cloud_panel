services:
  sos_cloud_panel:
    build: ./app
    container_name: ${PANEL_CONTAINER_NAME:-sos_cloud_panel}
    restart: always
    pid: "host"
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    env_file:
      - .env
    ports:
      - "${PANEL_BIND_IP:-127.0.0.1}:${PANEL_PORT:-8095}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ${HOST_RCLONE_DIR:-/root/.config/rclone}:/root/.config/rclone
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOST_NGINX_SITES:-/etc/nginx/sites-enabled}:/host_nginx/sites-enabled:ro
      - /:/hostfs:ro
    networks:
      - pg_net

networks:
  pg_net:
    external: true
    name: ${DOCKER_NETWORK:-odoo-net}
